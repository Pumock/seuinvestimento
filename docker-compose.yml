services:
  # ========================
  # SeuInvestimento Backend - Prod
  # ========================
  backend:
    image: seuinvestimento-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: seuinvestimento-backend
    restart: unless-stopped
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:prod"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - seuinvestimento-network

  # ========================
  # SeuInvestimento Frontend - Prod
  # ========================
  frontend:
    image: seuinvestimento-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: seuinvestimento-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - seuinvestimento-network

  # ========================
  # Redis Cache
  # ========================
  redis:
    image: redis:7
    container_name: seuinvestimento-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-change_me_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - seuinvestimento-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================
  # MinIO Storage
  # ========================
  minio:
    image: minio/minio
    container_name: seuinvestimento-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - seuinvestimento-network

  # ========================
  # PostgreSQL Database
  # ========================
  postgres:
    image: postgres:15
    container_name: seuinvestimento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-seuinvestimento}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - seuinvestimento-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-seuinvestimento}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    driver: local
  minio_data:
    driver: local
  pgdata:
    driver: local

networks:
  seuinvestimento-network:
    driver: bridge
