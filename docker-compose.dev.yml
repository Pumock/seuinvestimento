services:
  # ========================
  # SeuInvestimento Backend - Dev
  # ========================
  backend:
    image: seuinvestimento-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: seuinvestimento-backend-dev
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - seuinvestimento-network

  # ========================
  # SeuInvestimento Frontend - Dev
  # ========================
  frontend:
    image: seuinvestimento-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: seuinvestimento-frontend-dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    networks:
      - seuinvestimento-network

  # ========================
  # Redis
  # ========================
  redis:
    image: redis:7
    container_name: seuinvestimento-redis-dev
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-change_me_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - seuinvestimento-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================
  # MinIO
  # ========================
  minio:
    image: minio/minio
    container_name: seuinvestimento-minio-dev
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - seuinvestimento-network

  # ========================
  # PostgreSQL
  # ========================
  postgres:
    image: postgres:15
    container_name: seuinvestimento-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seuinvestimento
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - seuinvestimento-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seuinvestimento"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_next:
    driver: local
  minio_data:
    driver: local
  pgdata:
    driver: local

networks:
  seuinvestimento-network:
    driver: bridge
